<!doctype html><html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#20242b}
  #og{position:relative;width:1200px;height:630px;overflow:hidden;background:radial-gradient(circle at 75% 35%,#3a3326 0,#20242b 60%);font-family:"Hiragino Maru Gothic ProN","Noto Sans CJK JP",sans-serif;color:#f4f1ea}
  #master{position:absolute;right:0;top:0;width:640px;height:330px;object-fit:cover;object-position:40% 30%;opacity:.95;
    -webkit-mask-image:linear-gradient(to left,#000 55%,transparent);mask-image:linear-gradient(to left,#000 55%,transparent)}
  .title{position:absolute;left:56px;top:46px;line-height:1.12;font-weight:900}
  .title .s{font-size:46px;letter-spacing:.04em}
  .title .b{font-size:84px;color:#f2b632;text-shadow:0 6px 0 #7a5a12}
  #pencil{position:absolute;left:40px;bottom:58px}
  #cat{position:absolute;right:28px;bottom:-6px;width:250px;filter:drop-shadow(0 8px 8px #0009)}
  .tag{position:absolute;left:58px;bottom:22px;font-size:22px;opacity:.85;letter-spacing:.08em}
</style></head><body>
<div id="og">
  <img id="master"><div style="position:absolute;right:0;top:250px;width:640px;height:82px;background:linear-gradient(transparent,#24252a)"></div>
  <div class="title"><div class="s">鉛筆削りがなかった僕は、</div><div class="b">旋盤で</div><div class="b">削ることにした。</div></div>
  <canvas id="pencil" width="860" height="150"></canvas>
  <img id="cat">
  <div class="tag">回る鉛筆を、点線の形に削れ。</div>
</div>
<script type="module">
import masterUrl from '../src/assets/master.jpg';
import catUrl from '../src/assets/cat.webp';
import { STAGES, buildTarget, tipStartIndex } from '../src/stages.js';
import { PENCIL_RADIUS } from '../src/config.js';
const load = (img, src) => new Promise((r) => { img.onload = r; img.src = src; });
await Promise.all([load(document.getElementById('master'), masterUrl), load(document.getElementById('cat'), catUrl)]);
// 先がこけしになった緑の鉛筆を、立体っぽく描く
const c = document.getElementById('pencil'), ctx = c.getContext('2d');
const t = buildTarget(STAGES[2]), k = tipStartIndex(STAGES[2]), n = t.length;
const W = c.width, H = c.height, cy = H / 2, sy = (H * 0.46) / PENCIL_RADIUS, sx = (W - 10) / (n - 1);
const shade = (top, mid, bot) => { const g = ctx.createLinearGradient(0, cy - H / 2, 0, cy + H / 2); g.addColorStop(0, top); g.addColorStop(0.35, mid); g.addColorStop(1, bot); return g; };
const band = (i0, i1, fill) => { ctx.beginPath(); for (let i = i0; i <= i1; i++) ctx.lineTo(i * sx, cy - t[i] * sy); for (let i = i1; i >= i0; i--) ctx.lineTo(i * sx, cy + t[i] * sy); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); };
band(0, k, shade('#4fc27f', '#1f8a4c', '#0c3d21'));
band(k, n - 1, shade('#fbe3bd', '#e8c99a', '#8d6a3f'));
ctx.setLineDash([10, 8]); ctx.strokeStyle = '#7fe3ff'; ctx.lineWidth = 3;
ctx.beginPath(); for (let i = k - 6; i < n; i++) ctx.lineTo(i * sx, cy - t[i] * sy - 6); ctx.stroke();
document.title = 'ready';
</script></body></html>
