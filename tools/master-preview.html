<!doctype html><html><body style="margin:0;background:#20242b">
<canvas id="c" width="1400" height="720"></canvas>
<script type="module">
import { drawMasterPhoto } from '../src/master.js';
import url from '../src/assets/master.jpg';
const ctx = document.getElementById('c').getContext('2d');
const img = new Image(); img.src = url;
img.onload = () => {
  ctx.font = 'bold 28px sans-serif'; ctx.fillStyle = '#f4f1ea';
  ['S','A','B','C'].forEach((m, i) => {
    const x = 20 + (i % 2) * 690, y = 20 + Math.floor(i / 2) * 350;
    ctx.save(); ctx.translate(x, y); drawMasterPhoto(ctx, img, m, 660, 300); ctx.restore();
    ctx.fillStyle = '#f4f1ea'; ctx.fillText(m, x + 12, y + 336);
  });
  document.title = 'ready';
};
</script></body></html>
